name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate whitespace and diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check ${{ github.event.pull_request.base.sha }} HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Ensure verify script is executable
        run: chmod +x ./scripts/verify-local.sh

      - name: Run verification
        run: ./scripts/verify-local.sh

  runtime-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build startup test artifacts
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumentation startup gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.example.ExampleInstrumentedTest#mainActivity_startsAndRendersOnboardingEntryPoint,com.example.ExampleInstrumentedTest#mainActivity_showsOnboardingStepIndicator,com.example.ExampleInstrumentedTest#mainActivity_survivesSingleRecreation,com.example.ExampleInstrumentedTest#mainActivity_survivesRotationChange,com.example.MainActivityColdStartInstrumentedTest#mainActivity_coldStartSkipsOnboardingWhenCompleted
