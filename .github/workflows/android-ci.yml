name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository (PR exact head)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4

      - name: Verify exact PR head checkout
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Expected PR head: ${{ github.event.pull_request.head.sha }}"
          echo "Checked out HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate whitespace and diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check ${{ github.event.pull_request.base.sha }} HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Ensure verify script is executable
        run: chmod +x ./scripts/verify-local.sh

      - name: Run verification
        run: ./scripts/verify-local.sh

  runtime-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify

    steps:
      - name: Checkout repository (PR exact head)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout repository
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4

      - name: Verify exact PR head checkout
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Expected PR head: ${{ github.event.pull_request.head.sha }}"
          echo "Checked out HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storetype JKS
          fi

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fail fast when KVM is unavailable
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error title=EMULATOR_INFRASTRUCTURE_FAILURE::/dev/kvm is missing on this runner. Failing before emulator launch."
            ls -l /dev || true
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error title=EMULATOR_INFRASTRUCTURE_FAILURE::/dev/kvm is not readable/writable by the current user."
            id
            getent group kvm || true
            ls -l /dev/kvm || true
            exit 1
          fi
          ls -l /dev/kvm

      - name: Build startup test artifacts
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Ensure runtime startup gate script is executable
        run: chmod +x ./scripts/runtime-startup-gate.sh

      - name: Run instrumentation startup gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-boot-timeout: 240
          profile: pixel_4
          script: ./scripts/runtime-startup-gate.sh
