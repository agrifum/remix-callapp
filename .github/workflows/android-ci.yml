name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Apply bounded overlay patch
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          python scripts/apply_overlay_session_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/system/overlay/CallOverlayService.kt app/src/main/java/com/example/data/repository/CallDraftRepository.kt
          git commit -m "fix(overlay): persist active session until call end"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate whitespace and diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check ${{ github.event.pull_request.base.sha }} HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Ensure verify script is executable
        run: chmod +x ./scripts/verify-local.sh

      - name: Run verification
        run: ./scripts/verify-local.sh
