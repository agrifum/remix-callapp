name: Build TEST_BASELINE_1 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-test-baseline-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact TEST_BASELINE_1
        uses: actions/checkout@v4
        with:
          ref: 4d133d0698657a9ebeb7ae6c6da4766d18d5c030
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify exact baseline
        run: |
          chmod +x ./scripts/verify-local.sh
          ./scripts/verify-local.sh

      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CallUpp-TEST_BASELINE_1-4d133d0-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
