name: Apply overlay session patch

on:
  push:
    branches: [fix/overlay-save-keeps-session]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overlay-save-keeps-session
      - name: Apply bounded source patch
        shell: python
        run: |
          from pathlib import Path

          service = Path('app/src/main/java/com/example/system/overlay/CallOverlayService.kt')
          text = service.read_text()
          text = text.replace(
              'var selectedPreliminaryTimeMinute: Int? = existingDraft?.preliminaryTimeMinute\n\n            val buildCurrentDraft',
              'var selectedPreliminaryTimeMinute: Int? = existingDraft?.preliminaryTimeMinute\n            var taskRequested = existingDraft?.taskRequested == true\n\n            val buildCurrentDraft',
          )
          text = text.replace('taskRequested = false,\n                    updatedAt', 'taskRequested = taskRequested,\n                    updatedAt')
          old = '''            // Helper to commit and close
            fun commitAndClose(toTasks: Boolean) {
                isCommitted = true
                draftSaveJob?.cancel()
                draftSaveJob = null
                currentDraftProvider = null
                releaseOverlayFocus()
                val noteText = overlayNote.text?.toString() ?: ""

                app.container.callDraftRepository.tryClaimManualCommit(currentSessionId)

                app.container.appScope.launch {
                    val clientDisplayName = when {
                        client != null -> client.displayName
                        isMarkAsClient -> app.container.contactLookupRepository.resolveDisplayName(key)
                        else -> null
                    }

                    val req = OverlayCommitRequest(
                        callSessionId = currentSessionId,
                        phone = key,
                        noteText = noteText,
                        markAsClient = isMarkAsClient,
                        clientDisplayName = clientDisplayName,
                        createJob = createJob,
                        serviceId = selectedServiceId,
                        preliminaryDateEpochDay = selectedPreliminaryDateEpochDay,
                        preliminaryTimeMinute = selectedPreliminaryTimeMinute,
                        createOpenTask = toTasks,
                        callDirection = currentDirection,
                        callTimestamp = currentCallTimestamp
                    )
                    app.container.callDraftRepository.commitOverlaySession(req)
                }
                hideOverlayWindow()
                stopSelf()
            }

            // 10. "Do Zadań"
            taskButton.setOnClickListener {
                commitAndClose(toTasks = true)
            }

            // 11. "Zapisz"
            saveButton.setOnClickListener {
                commitAndClose(toTasks = false)
            }
'''
          new = '''            // Save/update the active call draft without ending the overlay session.
            fun saveAndCollapse(toTasks: Boolean) {
                if (toTasks) taskRequested = true
                draftSaveJob?.cancel()
                draftSaveJob = null
                saveCurrentDraft()
                interactionState.onSaved()
                collapseOverlay()
            }

            // 10. "Do Zadań"
            taskButton.setOnClickListener {
                saveAndCollapse(toTasks = true)
            }

            // 11. "Zapisz"
            saveButton.setOnClickListener {
                saveAndCollapse(toTasks = false)
            }
'''
          if old not in text:
              raise SystemExit('Expected commitAndClose block not found')
          service.write_text(text.replace(old, new))

          repo = Path('app/src/main/java/com/example/data/repository/CallDraftRepository.kt')
          r = repo.read_text()
          old2 = '''        if (draft.noteText.isNotBlank()) {
            val key = PhoneNumberNormalizer.normalizeKey(draft.phoneKey)
            database.withTransaction {
                val note = NoteEntity(
                    id = UUID.randomUUID().toString(),
                    phoneKey = key,
                    rawText = draft.noteText.trim(),
                    source = NoteSource.CALL,
                    sourceCallDirection = callDirection,
                    sourceCallAt = callTime ?: System.currentTimeMillis()
                )
                noteDao.insertNote(note)
                callDraftDao.deleteDraft(callSessionId)
            }
            // Mark committed only after the database transaction successfully commits
            markSessionCommitted(callSessionId)
        } else {
            callDraftDao.deleteDraft(callSessionId)
            markSessionCommitted(callSessionId)
        }
'''
          new2 = '''        val request = OverlayCommitRequest(
            callSessionId = callSessionId,
            phone = draft.phoneKey,
            noteText = draft.noteText,
            markAsClient = draft.markAsClient,
            clientDisplayName = null,
            createJob = draft.createJob,
            serviceId = draft.serviceId,
            preliminaryDateEpochDay = draft.preliminaryDateEpochDay,
            preliminaryTimeMinute = draft.preliminaryTimeMinute,
            createOpenTask = draft.taskRequested,
            callDirection = callDirection,
            callTimestamp = callTime
        )
        performCommitOverlaySession(request)
'''
          if old2 not in r:
              raise SystemExit('Expected call-end draft commit block not found')
          repo.write_text(r.replace(old2, new2))
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/example/system/overlay/CallOverlayService.kt app/src/main/java/com/example/data/repository/CallDraftRepository.kt
          git commit -m "fix(overlay): persist active session until call end"
          git push origin HEAD:fix/overlay-save-keeps-session
