name: Build PR13 Candidate APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-pr13-candidate-apk.yml"

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR13 candidate
        uses: actions/checkout@v4
        with:
          ref: 352d6b2eb9645512ac674aa653973fb86283c549
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "352d6b2eb9645512ac674aa653973fb86283c549"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify exact candidate
        run: |
          chmod +x ./scripts/verify-local.sh
          ./scripts/verify-local.sh

      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CallUpp-PR13-CANDIDATE-352d6b2-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
