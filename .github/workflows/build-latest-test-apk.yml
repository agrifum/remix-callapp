name: Build Latest CallUpp Test APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callupp-latest-test-apk
  cancel-in-progress: false

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable test signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: callupp-test-debug-keystore-v1

      - name: Create test signing key on first run
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=CallUpp Test,O=CallUpp,C=PL" \
            -storetype JKS

      - name: Verify project and build APK
        run: |
          chmod +x ./scripts/verify-local.sh
          ./scripts/verify-local.sh

      - name: Prepare downloadable APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CallUpp-latest-test.apk
          sha256sum CallUpp-latest-test.apk | tee CallUpp-latest-test.apk.sha256

      - name: Upload latest test APK
        uses: actions/upload-artifact@v4
        with:
          name: CallUpp-latest-test-${{ github.sha }}
          path: |
            CallUpp-latest-test.apk
            CallUpp-latest-test.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
