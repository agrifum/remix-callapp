name: Build Latest CallUpp Test APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callupp-latest-test-apk
  cancel-in-progress: false

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CALLUPP_VERSION_CODE: ${{ github.run_number }}
      CALLUPP_VERSION_NAME: 1.0.${{ github.run_number }}-test
      CALLUPP_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable test signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: callupp-test-debug-keystore-v1

      - name: Create test signing key on first run
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=CallUpp Test,O=CallUpp,C=PL" \
            -storetype JKS

      - name: Verify project and build APK
        run: |
          chmod +x ./scripts/verify-local.sh
          ./scripts/verify-local.sh

      - name: Prepare downloadable APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="CallUpp-test-v${CALLUPP_VERSION_NAME}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload latest test APK
        uses: actions/upload-artifact@v4
        with:
          name: CallUpp-test-v${{ env.CALLUPP_VERSION_NAME }}-${{ github.sha }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
